<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <!-- A fictional map in the site palette. Not a real place: the streets,
       park and river are invented. No text, so it renders identically
       everywhere without depending on installed fonts. -->

  <!-- City blocks show through as the ground colour between streets. -->
  <rect width="1200" height="500" fill="#e8e0cf" />

  <!-- Minor street grid, turned slightly so it reads as a real town. -->
  <g transform="rotate(-9 600 250)" stroke="#f6f1e7" stroke-width="9" stroke-linecap="square">
    <line x1="-300" y1="-40" x2="1500" y2="-40" />
    <line x1="-300" y1="30" x2="1500" y2="30" />
    <line x1="-300" y1="100" x2="1500" y2="100" />
    <line x1="-300" y1="170" x2="1500" y2="170" />
    <line x1="-300" y1="240" x2="1500" y2="240" />
    <line x1="-300" y1="310" x2="1500" y2="310" />
    <line x1="-300" y1="380" x2="1500" y2="380" />
    <line x1="-300" y1="450" x2="1500" y2="450" />
    <line x1="-300" y1="520" x2="1500" y2="520" />
    <line x1="-300" y1="590" x2="1500" y2="590" />

    <line x1="-120" y1="-300" x2="-120" y2="800" />
    <line x1="-25" y1="-300" x2="-25" y2="800" />
    <line x1="70" y1="-300" x2="70" y2="800" />
    <line x1="165" y1="-300" x2="165" y2="800" />
    <line x1="260" y1="-300" x2="260" y2="800" />
    <line x1="355" y1="-300" x2="355" y2="800" />
    <line x1="450" y1="-300" x2="450" y2="800" />
    <line x1="545" y1="-300" x2="545" y2="800" />
    <line x1="640" y1="-300" x2="640" y2="800" />
    <line x1="735" y1="-300" x2="735" y2="800" />
    <line x1="830" y1="-300" x2="830" y2="800" />
    <line x1="925" y1="-300" x2="925" y2="800" />
    <line x1="1020" y1="-300" x2="1020" y2="800" />
    <line x1="1115" y1="-300" x2="1115" y2="800" />
    <line x1="1210" y1="-300" x2="1210" y2="800" />
    <line x1="1305" y1="-300" x2="1305" y2="800" />
  </g>

  <!-- Park -->
  <path d="M842 36 C930 18 1060 26 1118 70 C1168 108 1160 188 1112 226 C1060 266 958 262 900 238 C842 214 796 160 800 104 C803 70 812 44 842 36 Z" fill="#d8e1d0" />
  <path d="M836 120 C900 96 980 150 1050 118 C1090 100 1112 132 1132 150" fill="none" stroke="#e7ede2" stroke-width="5" stroke-linecap="round" />
  <path d="M930 40 C948 110 912 170 960 250" fill="none" stroke="#e7ede2" stroke-width="5" stroke-linecap="round" />
  <circle cx="1010" cy="180" r="26" fill="#cbd8c5" />

  <!-- River -->
  <path d="M-40 118 C120 96 210 186 300 250 C392 316 404 420 520 470 C600 504 700 520 780 560" fill="none" stroke="#c8d4cd" stroke-width="54" stroke-linecap="round" />

  <!-- Main roads: a pale casing under a cream carriageway, drawn over the
       river so they read as bridges. -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 356 C240 320 520 304 800 280 C960 266 1080 262 1240 250" stroke="#d9ccb6" stroke-width="27" />
    <path d="M-40 356 C240 320 520 304 800 280 C960 266 1080 262 1240 250" stroke="#fffcf6" stroke-width="20" />

    <path d="M470 -40 C520 120 560 260 610 540" stroke="#d9ccb6" stroke-width="23" />
    <path d="M470 -40 C520 120 560 260 610 540" stroke="#fffcf6" stroke-width="17" />
  </g>

  <!-- The clinic's own block, outlined in sage. -->
  <g transform="rotate(-9 700 212)">
    <rect x="660" y="176" width="82" height="58" rx="6" fill="#e1d4bd" stroke="#6e8672" stroke-width="3" />
  </g>

  <!-- Parking, behind Gate 2 -->
  <g transform="translate(784 300)">
    <rect width="34" height="34" rx="8" fill="#8a8073" />
    <path d="M12.5 26 V9 H19 A5.5 5.5 0 0 1 19 20 H12.5" fill="none" stroke="#fff9ef" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Location pin -->
  <circle cx="700" cy="206" r="54" fill="#6e8672" fill-opacity="0.16" />
  <ellipse cx="700" cy="208" rx="22" ry="7" fill="#2e2a26" fill-opacity="0.22" />
  <path d="M700 206 C680 178 664 160 664 138 A36 36 0 1 1 736 138 C736 160 720 178 700 206 Z" fill="#6e8672" stroke="#fff9ef" stroke-width="3" />
  <circle cx="700" cy="138" r="13" fill="#fff9ef" />
</svg>
